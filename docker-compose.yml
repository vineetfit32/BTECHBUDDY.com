# BTECHBUDDY self-hosted stack. Nothing here calls a third-party API at runtime.
#
#   docker compose up -d                      -> Postgres + MinIO + Mailpit (dev essentials)
#   docker compose --profile ai up -d         -> + Ollama (local LLM + embeddings)
#   docker compose --profile live up -d       -> + LiveKit SFU, coturn, Egress recorder, whiteboard sync
#   docker compose --profile app up -d        -> + the Next.js app and the HLS transcode worker
#
# Production mail: replace Mailpit with the Postfix relay in the "mail" profile.

name: btechbuddy

x-app-env: &app-env
  DATABASE_URL: postgresql://btechbuddy:btechbuddy@postgres:5432/btechbuddy
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
  STORAGE_PROVIDER: s3
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: btechbuddy
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-btechbuddy}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-btechbuddy-secret}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_FROM: ${SMTP_FROM:-BTECHBUDDY <no-reply@btechbuddy.in>}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
  LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
  EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
  LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
  LIVEKIT_INTERNAL_URL: http://livekit:7880
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-btechbuddy}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-change-me-to-a-long-random-livekit-secret}
  WHITEBOARD_WS_URL: ${WHITEBOARD_WS_URL:-ws://localhost:1234}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: btechbuddy
      POSTGRES_PASSWORD: btechbuddy
      POSTGRES_DB: btechbuddy
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btechbuddy"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-btechbuddy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-btechbuddy-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["1025:1025", "8025:8025"]

  postfix:
    profiles: [mail]
    image: boky/postfix:latest
    restart: unless-stopped
    environment:
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN:-btechbuddy.in}
      HOSTNAME: mail.${MAIL_DOMAIN:-btechbuddy.in}
    ports: ["2525:587"]

  ollama:
    profiles: [ai]
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    # Uncomment on a machine with an NVIDIA GPU and the container toolkit installed.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ollama-pull:
    profiles: [ai]
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${LLM_MODEL:-qwen3:8b} && ollama pull ${EMBED_MODEL:-nomic-embed-text}"]
    restart: "no"

  redis:
    profiles: [live]
    image: redis:7-alpine
    restart: unless-stopped

  livekit:
    profiles: [live]
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    depends_on: [redis]
    ports: ["7880:7880", "7881:7881", "50000-50100:50000-50100/udp"]
    volumes: [./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro]

  egress:
    profiles: [live]
    image: livekit/egress:latest
    restart: unless-stopped
    depends_on: [livekit, redis]
    cap_add: [SYS_ADMIN]
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./docker/livekit/egress.yaml:/etc/egress.yaml:ro
      - recordings:/out

  coturn:
    profiles: [live]
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes: [./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro]

  whiteboard:
    profiles: [live]
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "scripts/whiteboard-server.mjs"]
    environment:
      PORT: 1234
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports: ["1234:1234"]
    volumes: [./:/app:ro]

  app:
    profiles: [app]
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment: *app-env
    ports: ["3000:3000"]
    volumes: [recordings:/recordings]

  transcoder:
    profiles: [app]
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker:transcode"]
    depends_on:
      postgres: { condition: service_healthy }
    environment: *app-env
    volumes: [recordings:/recordings]

volumes:
  pgdata:
  miniodata:
  ollama:
  recordings:
