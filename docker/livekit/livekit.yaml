# Keys must match LIVEKIT_API_KEY and LIVEKIT_API_SECRET (compose defaults).
port: 7880
bind_addresses:
  - ""
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  turn_servers:
    - host: coturn
      port: 3478
      protocol: udp
      secret: btechbuddy-turn-secret
redis:
  address: redis:6379
keys:
  btechbuddy: change-me-to-a-long-random-livekit-secret
logging:
  level: info
room:
  max_participants: 500
  empty_timeout: 300
